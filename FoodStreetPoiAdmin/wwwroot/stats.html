<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FoodStreet Audio Stats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <i class="fa-solid fa-map-location-dot brand-icon"></i>
        <span>FS Admin</span>
      </div>
      <nav class="sidebar-nav">
        <a href="/" class="nav-item" id="navPoiManage">
          <i class="fa-solid fa-list-check"></i>
          <span>Quản lý POI</span>
        </a>
        <a href="/stats.html" class="nav-item active" id="navAudioStats">
          <i class="fa-solid fa-chart-column"></i>
          <span>Thống kê lượt phát Audio</span>
        </a>
        <a href="/owner.html" class="nav-item" id="ownerManageNav" hidden>
          <i class="fa-solid fa-user-shield"></i>
          <span>Quản lý Owner</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-profile">
          <img id="sidebarUserAvatar" src="https://ui-avatars.com/api/?name=Admin&background=4f46e5&color=fff&rounded=true" alt="Admin" />
          <div class="user-info">
            <span class="user-name" id="sidebarUserName">Super Admin</span>
            <span class="user-role" id="sidebarUserRole">Hệ thống</span>
          </div>
        </div>
      </div>
    </aside>

    <div class="main-board">
      <header class="topbar">
        <div class="topbar-title">Bảng điều khiển (Dashboard)</div>
        <div class="topbar-actions">
          <button class="topbar-btn"><i class="fa-regular fa-bell"></i></button>
          <button class="topbar-btn"><i class="fa-solid fa-gear"></i></button>
          <button class="topbar-btn" id="logoutBtn" title="Dang xuat"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
      </header>

      <div class="scroll-container">
        <main class="layout" style="grid-template-columns: 1fr;">
          <section class="card">
            <header class="card-header">
              <div class="card-title">
                <i class="fa-solid fa-chart-column"></i>
                <h2>Thống kê lượt phát Audio</h2>
              </div>
              <div class="header-actions filters-toolbar">
                <label>
                  Từ ngày
                  <input type="date" id="audioStatsFrom" />
                </label>
                <label>
                  Đến ngày
                  <input type="date" id="audioStatsTo" />
                </label>
                <label>
                  Sắp xếp
                  <select id="audioStatsSort">
                    <option value="desc">Nhiều đến ít</option>
                    <option value="asc">Ít đến nhiều</option>
                  </select>
                </label>
                <button type="button" id="audioStatsReloadBtn" class="secondary">
                  <i class="fa-solid fa-rotate-right"></i> Tải lại
                </button>
              </div>
            </header>
            <div class="stats-summary" id="audioStatsSummary">Chưa có dữ liệu.</div>
            <div class="table-responsive">
              <table>
                <thead>
                  <tr>
                    <th width="90">POI ID</th>
                    <th>Tên POI</th>
                    <th width="140">Lượt phát</th>
                    <th width="220">Lần phát gần nhất</th>
                  </tr>
                </thead>
                <tbody id="audioStatsRows"></tbody>
              </table>
            </div>
            <p id="audioStatsStatus" class="small muted mt-10"></p>
          </section>
        </main>
      </div>
    </div>
  </div>

  <dialog id="authDialog" class="qr-dialog">
    <form id="authForm" method="dialog" class="qr-panel">
      <header class="qr-header">
        <div class="qr-title">
          <i class="fa-solid fa-lock"></i>
          <h3>Đăng nhập quản trị</h3>
        </div>
      </header>
      <div class="form-group">
        <label>Username
          <input id="authUsername" type="text" required />
        </label>
      </div>
      <div class="form-group">
        <label>Password
          <input id="authPassword" type="password" required />
        </label>
      </div>
      <div class="actions">
        <button type="submit"><i class="fa-solid fa-right-to-bracket"></i> Đăng nhập </button>
      </div>
      <p id="authStatus" class="small muted mt-10"></p>
    </form>
  </dialog>

  <script src="/stats.js?v=20260409-audio-stats-page"></script>
</body>
</html>
