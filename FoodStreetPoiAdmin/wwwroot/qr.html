<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FoodStreet QR Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <div class="dashboard">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <i class="fa-solid fa-map-location-dot brand-icon"></i>
        <span>FS Admin</span>
      </div>
      <nav class="sidebar-nav">
        <a href="/" class="nav-item" id="navPoiManage">
          <i class="fa-solid fa-list-check"></i>
          <span>Quản lý POI</span>
        </a>
        <a href="/monitoring.html" class="nav-item" id="monitoringNav" hidden>
          <i class="fa-solid fa-chart-line"></i>
          <span>Hoạt động Hệ thống</span>
        </a>
        <a href="/stats.html" class="nav-item" id="navAudioStats">
          <i class="fa-solid fa-chart-column"></i>
          <span>Thống kê lượt phát Audio</span>
        </a>
        <a href="/owner.html" class="nav-item" id="ownerManageNav" hidden>
          <i class="fa-solid fa-user-shield"></i>
          <span>Quản lý Owner</span>
        </a>
        <a href="/qr.html" class="nav-item active" id="qrManageNav">
          <i class="fa-solid fa-qrcode"></i>
          <span>Quản lý QR</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-profile">
          <img id="sidebarUserAvatar"
            src="https://ui-avatars.com/api/?name=Admin&background=4f46e5&color=fff&rounded=true" alt="Admin" />
          <div class="user-info">
            <span class="user-name" id="sidebarUserName">Super Admin</span>
            <span class="user-role" id="sidebarUserRole">Hệ thống</span>
          </div>
        </div>
      </div>
    </aside>

    <div class="main-board">
      <header class="topbar">
        <div class="topbar-title">Quản lý QR</div>
        <div class="topbar-actions">
          <button class="topbar-btn" id="logoutBtn" title="Đăng xuất"><i
              class="fa-solid fa-right-from-bracket"></i></button>
        </div>
      </header>

      <div class="scroll-container">
        <main class="layout" style="grid-template-columns: 1fr;">
          <section class="card">
            <header class="card-header">
              <div class="card-title">
                <i class="fa-solid fa-qrcode"></i>
                <h2>Tạo / sửa QR theo POI</h2>
              </div>
            </header>
            <form id="qrForm">
              <div class="grid-2">
                <div class="form-group">
                  <label>POI
                    <select id="qrPoiId" required></select>
                  </label>
                </div>
                <div class="form-group">
                  <label>Giá mở khóa (VND)
                    <input id="qrPrice" type="number" min="0" step="1000" value="0" required />
                  </label>
                </div>
              </div>
              <div class="grid-2">
                <div class="form-group">
                  <label>Ngôn ngữ mặc định
                    <select id="qrLang"></select>
                  </label>
                </div>
              </div>
              <div class="actions">
                <button type="submit"><i class="fa-solid fa-floppy-disk"></i> Tạo / Cập nhật QR</button>
                <button type="button" id="qrViewBtn" class="secondary"><i class="fa-regular fa-eye"></i> Xem QR</button>
                <button type="button" id="qrResetBtn" class="secondary"><i class="fa-solid fa-rotate-right"></i> Làm mới</button>
              </div>
              <p id="qrStatus"></p>
            </form>
          </section>

          <section class="card">
            <header class="card-header">
              <div class="card-title">
                <i class="fa-solid fa-table-list"></i>
                <h2>Danh sách QR theo POI</h2>
              </div>
            </header>
            <div class="table-responsive">
              <table>
                <thead>
                  <tr>
                    <th width="80">POI ID</th>
                    <th>Tên POI</th>
                    <th width="160">Giá mở khóa</th>
                    <th width="220">Cập nhật lần cuối</th>
                    <th width="180">Hành động</th>
                  </tr>
                </thead>
                <tbody id="qrRows"></tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>
  </div>

  <dialog id="authDialog" class="qr-dialog">
    <form id="authForm" method="dialog" class="qr-panel">
      <header class="qr-header">
        <div class="qr-title">
          <i class="fa-solid fa-lock"></i>
          <h3>Đăng nhập quản trị</h3>
        </div>
      </header>
      <div class="form-group">
        <label>Username
          <input id="authUsername" type="text" required />
        </label>
      </div>
      <div class="form-group">
        <label>Password
          <input id="authPassword" type="password" required />
        </label>
      </div>
      <div class="actions">
        <button type="submit"><i class="fa-solid fa-right-to-bracket"></i> Đăng nhập</button>
      </div>
      <p id="authStatus" class="small muted mt-10"></p>
    </form>
  </dialog>

  <dialog id="qrDialog" class="qr-dialog">
    <form method="dialog" class="qr-panel">
      <header class="qr-header">
        <div class="qr-title">
          <i class="fa-solid fa-qrcode"></i>
          <h3>Xem QR</h3>
        </div>
        <button type="submit" class="secondary icon-only round-btn"><i class="fa-solid fa-xmark"></i></button>
      </header>
      <div class="form-group">
        <label>Public URL
          <input id="qrPublicUrl" type="text" readonly />
        </label>
      </div>
      <div class="qr-preview-wrap">
        <img id="qrPreviewImage" alt="POI QR code" />
      </div>
      <div class="actions center mt-20">
        <button type="button" id="qrCopyBtn" class="secondary"><i class="fa-regular fa-copy"></i> Copy Link</button>
        <a id="qrDownloadBtn" class="button-link" href="#" download><i class="fa-solid fa-download"></i> Tải QR</a>
      </div>
    </form>
  </dialog>

  <script src="/qr.js?v=20260415-qr-hide-base-url"></script>
</body>

</html>
