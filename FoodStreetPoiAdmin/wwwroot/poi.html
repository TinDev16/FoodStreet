<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FoodStreet - Khám phá điểm đến</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/poi.css">
</head>
<body>
  <!-- Thanh thông báo cài app -->
  <div id="appInstallPrompt" class="app-install-prompt" hidden>
    <div class="app-install-card">
      <div class="app-install-icon">📱</div>
      <div class="app-install-content">
        <strong>Trải nghiệm tốt hơn với App FoodStreet</strong>
        <p>Xem POI trên bản đồ, nhận thông báo và nhiều tính năng hấp dẫn</p>
        <div class="app-install-actions">
          <button id="openAppBtn" class="btn-primary btn-sm">Mở App</button>
          <button id="dismissInstallPromptBtn" class="btn-outline btn-sm">Để sau</button>
        </div>
      </div>
    </div>
  </div>

  <main class="poi-container">
    <!-- Thông tin POI chính -->
    <div class="poi-card main-card">
      <div class="card-header">
        <h1 id="poiName">Đang tải...</h1>
        <div class="lang-selector">
          <label for="langSelect">🌐 Ngôn ngữ</label>
          <select id="langSelect" class="lang-dropdown"></select>
        </div>
      </div>

      <div class="poi-media">
        <img id="poiImage" class="poi-image" alt="Hình ảnh địa điểm" hidden>
        <div class="poi-status-badge" id="poiStatusBadge"></div>
      </div>

      <div class="poi-description">
        <p id="poiDesc" class="desc-text"></p>
      </div>
      <div class="poi-payment" id="poiPaymentPanel" hidden>
        <strong id="poiPriceLabel">Premium</strong>
        <p id="poiPaymentHint">Bạn cần mở khóa để nghe audio.</p>
        <button id="unlockBtn" class="btn-secondary">Mở khóa ngay</button>
      </div>

      <div class="action-group">
        <button id="speakBtn" class="btn-primary">
          <span>🔊</span> Nghe giới thiệu
        </button>
        <button id="stopBtn" class="btn-outline">
          <span>⏹️</span> Dừng
        </button>
        <a id="mapBtn" class="btn-outline" target="_blank" rel="noopener noreferrer">
          <span>🗺️</span> Xem bản đồ
        </a>
        <button id="routeBtn" class="btn-secondary">
          <span>🚶</span> Chỉ đường
        </button>
      </div>

      <audio id="audioPlayer" controls hidden></audio>
      <div id="poiStatus" class="status-message"></div>
    </div>

    <!-- Bản đồ -->
    <div class="poi-card map-card">
      <h2>📍 Vị trí trên bản đồ</h2>
      <div class="map-wrapper">
        <iframe id="mapFrame" title="Bản đồ POI" loading="lazy"></iframe>
      </div>
    </div>
  </main>

  <script src="/poi.js?v=20260401-app-handoff"></script>
</body>
</html>
