<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quan ly POI</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="layout">
    <section class="card">
      <h1>Them / Sua POI</h1>
      <form id="poiForm">
        <input name="id" type="hidden" />

        <label>Ten shop
          <input name="shopName" type="text" required />
        </label>

        <label>GPS (vd: 10.762548634412715, 106.70321804519753)
          <input name="gps" type="text" required />
        </label>

        <div class="gps-preview">
          <span>Lat: <strong id="latPreview">--</strong></span>
          <span>Lon: <strong id="lonPreview">--</strong></span>
        </div>

        <label>Radius (m)
          <input name="radiusMeters" type="number" step="any" min="1" value="15" required />
        </label>

        <label>Mo ta shop
          <textarea name="description"></textarea>
        </label>

        <label>Hinh anh (tu may tinh)
          <input name="imageFile" type="file" accept="image/*" />
        </label>

        <label>Audio file (tu may tinh)
          <input name="audioFile" type="file" accept="audio/*" />
        </label>

        <label>Hoac nhap noi dung de Text To Speech
          <textarea name="ttsText"></textarea>
        </label>

        <h2>Nội dung của POI đã nhập</h2>
        <div class="existing-media" id="existingMedia">
          <div class="media-row">
            <span>Audio cu: <a id="currentAudioLink" href="#" target="_blank" rel="noopener" hidden></a><span id="currentAudioEmpty">Khong co</span></span>
            <button type="button" id="clearAudioBtn" class="danger">Xoa audio</button>
          </div>
          <div class="media-row">
            <span>TTS cu: <span id="currentTtsText">Khong co</span></span>
            <button type="button" id="clearTtsBtn" class="danger">Xoa TTS</button>
          </div>
          <div class="media-row">
            <span>Anh cu: <a id="currentImageLink" href="#" target="_blank" rel="noopener" hidden></a><span id="currentImageEmpty">Khong co</span></span>
            <button type="button" id="clearImageBtn" class="danger">Xoa anh</button>
          </div>
        </div>

        <div class="actions">
          <button type="submit">Luu POI</button>
          <button type="button" id="resetBtn" class="secondary">Tao moi</button>
        </div>
      </form>
      <p id="status"></p>
    </section>

    <section class="card">
      <h2>Danh sach POI</h2>
      <table>
        <thead>
          <tr>
            <th>Ten shop</th>
            <th>GPS</th>
            <th>Radius</th>
            <th>Anh</th>
            <th>Audio/TTS</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="poiRows"></tbody>
      </table>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
