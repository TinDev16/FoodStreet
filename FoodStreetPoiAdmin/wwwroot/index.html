<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>POI Admin</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="layout">
    <section class="card">
      <header class="card-header">
        <h1>POI Management</h1>
        <div class="header-actions">
          <button type="button" id="createBtn" class="secondary">Add POI</button>
        </div>
      </header>

      <form id="poiForm" class="poi-form">
        <input name="id" type="hidden" />

        <label>Enter GPS
          <input name="gps" type="text" placeholder="lat, lon" required />
        </label>

        <div class="grid-2">
          <label>Latitude
            <input name="latitude" type="text" readonly required />
          </label>
          <label>Longitude
            <input name="longitude" type="text" readonly required />
          </label>
        </div>

        <label>Map link
          <input name="mapLink" type="url" readonly />
        </label>

        <div class="grid-2">
          <label>Radius (m)
            <input name="radiusMeters" type="number" step="any" min="1" value="15" required />
          </label>
          <label>Priority
            <input name="priority" type="number" step="1" value="0" required />
          </label>
        </div>

        <label>Input Language
          <select name="sourceLang" id="sourceLang"></select>
        </label>

        <label>POI Name
          <input name="sourceName" type="text" required />
        </label>

        <label>Description
          <textarea name="sourceDescription" placeholder="Description of the POI"></textarea>
        </label>

        <label>TTS Text
          <textarea name="sourceTtsText" placeholder="Content for TTS reading"></textarea>
        </label>

        <div class="file-block">
          <label>Image
            <input name="imageFile" type="file" accept="image/*" />
          </label>
          <div class="file-meta">
            <span>Current: <a id="currentImageLink" href="#" target="_blank" rel="noopener" hidden></a><span id="currentImageEmpty">None</span></span>
            <label class="checkbox">
              <input name="removeImage" type="checkbox" />
              <span>Remove</span>
            </label>
          </div>
        </div>

        <div class="file-block">
          <label>Audio (fallback)
            <input name="audioFile" type="file" accept="audio/*" />
          </label>
          <div class="file-meta">
            <span>Current: <a id="currentAudioLink" href="#" target="_blank" rel="noopener" hidden></a><span id="currentAudioEmpty">None</span></span>
            <label class="checkbox">
              <input name="removeAudio" type="checkbox" />
              <span>Remove</span>
            </label>
          </div>
        </div>

        <label class="checkbox">
          <input name="isActive" type="checkbox" />
          <span>Is Active</span>
        </label>

        <div class="actions">
          <button type="submit">Save</button>
          <button type="button" id="generateQrBtn" class="secondary">Tao QR POI dang chon</button>
          <button type="button" id="resetBtn" class="secondary">Reset</button>
        </div>
            </form>
            <p id="status"></p>
          </section>

          <section class="card">
            <header class="card-header">
        <h2>POI List</h2>
        <div class="small muted" id="listHint"></div>
            </header>
            <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>POI name</th>
            <th>Lat/Lon</th>
            <th>Radius</th>
            <th>Priority</th>
            <th>Active</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="poiRows"></tbody>
      </table>
    </section>
  </main>

  <dialog id="qrDialog" class="qr-dialog">
    <form method="dialog" class="qr-panel">
      <header class="qr-header">
        <h3>QR POI</h3>
        <button type="submit" class="secondary">Dong</button>
      </header>
      <p class="small muted">Quet ma de mo trang thong tin POI (TTS, vi tri, chi duong).</p>
      <label>Ngon ngu mac dinh
        <select id="qrLang"></select>
      </label>
      <label>Cloudflare Tunnel URL
        <input id="qrBaseUrl" type="url" placeholder="https://your-tunnel.trycloudflare.com" />
      </label>
      <div class="actions">
        <button type="button" id="qrDetectTunnelBtn" class="secondary">Lay tunnel URL</button>
      </div>
      <label>Public URL
        <input id="qrPublicUrl" type="text" readonly />
      </label>
      <div class="qr-preview-wrap">
        <img id="qrPreviewImage" alt="POI QR code" />
      </div>
      <div class="actions">
        <button type="button" id="qrCopyBtn" class="secondary">Copy URL</button>
        <a id="qrDownloadBtn" class="button-link" href="#" download>Tai QR PNG</a>
      </div>
    </form>
  </dialog>

  <script src="/app.js?v=20260401-qr-autotunnel"></script>
</body>
</html>
